name: CI Pipeline

on:
  push:
    branches:
      - "dev/**"
      - "feature/**"
      - "bugfix/**"
      - "main"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - "main"

env:
  IMAGE_NAME: ghcr.io/mourine2000/book-cafe-stock

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linter (ruff)
        run: ruff check .

      - name: Run unit tests (pytest)
        run: pytest -v

      - name: Determine image tag
        id: meta
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
            PUBLISH="true"
          elif [[ "${{ github.ref }}" == "refs/heads/main" && "${{ github.event_name }}" == "push" ]]; then
            TAG="sha-${{ github.sha }}"
            PUBLISH="true"
          else
            TAG="pr-${{ github.event.pull_request.number || github.run_id }}"
            PUBLISH="false"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_VERSION="${{ steps.meta.outputs.tag }}" \
            -t "${IMAGE_NAME}:${{ steps.meta.outputs.tag }}" \
            .

      - name: Run container vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

      - name: Log in to GHCR
        if: steps.meta.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Publish versioned Docker image
        if: steps.meta.outputs.publish == 'true'
        run: |
          docker push "${IMAGE_NAME}:${{ steps.meta.outputs.tag }}"
