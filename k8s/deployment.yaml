apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-cafe-stock
  labels:
    app: book-cafe-stock
spec:
  replicas: 2
  selector:
    matchLabels:
      app: book-cafe-stock
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: book-cafe-stock
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: book-cafe-stock
          image: ghcr.io/mourine2000/book-cafe-stock:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: book-cafe-config
          env:
            - name: NOTIFICATION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: book-cafe-secrets
                  key: NOTIFICATION_API_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
